<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonbreakers – NASA Space Apps 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b0a16;--ink:#f1ecd0;--dim:#8a85a8;--pan:#161425e6;--pan2:#0d0c1a;--acc:#6b4fa8;--hot:#ffd479;--font:'Silkscreen','Courier New',monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
#stage{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 100%;image-rendering:pixelated}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0005 2px 3px);mix-blend-mode:multiply}
#shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,#0b0a1699 0,#0b0a1600 70%)}
.title{position:absolute;left:0;right:0;top:28vh;text-align:center;margin:0;font-size:clamp(26px,8vw,110px);line-height:1;letter-spacing:3px;color:#fff;text-shadow:5px 5px 0 #000a}
.hide{display:none!important}
.start{position:absolute;left:50%;transform:translateX(-50%);top:62vh;padding:16px 40px;font-size:clamp(18px,3vw,36px);background:#000;letter-spacing:3px;box-shadow:5px 5px 0 #0008}
.start:hover{color:var(--hot)}
textarea{font:inherit;width:100%;min-height:150px;padding:10px;background:#05040b;color:var(--ink);border:2px solid var(--acc);line-height:1.6;font-size:12px;resize:vertical}
select{font:inherit;padding:8px;background:#05040b;color:var(--hot);border:2px solid var(--acc);font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.title small{display:block;margin-top:14px;font-size:clamp(9px,1.3vw,16px);color:var(--hot);text-shadow:2px 2px 0 #000;letter-spacing:3px}
nav{position:absolute;left:50%;transform:translateX(-50%);top:62vh;display:flex;flex-direction:column;gap:8px;width:min(320px,80vw)}
button{font:inherit;cursor:pointer;border:0;color:var(--ink)}
nav button{text-align:center;font-size:clamp(14px,2vw,24px);padding:14px 10px;background:#000;width:100%;box-shadow:4px 4px 0 #0008}
nav button.sel,nav button:hover{background:#151a2e;color:var(--hot)}
nav button.sel::before{content:"▶ ";color:var(--hot)}
nav button:disabled{color:var(--dim);background:#3a3550aa;cursor:not-allowed}
.sub{position:absolute;left:0;bottom:calc(8vh + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:5px}
.sub button{text-align:left;padding:8px 24px 8px 5vw;background:var(--pan2);font-size:clamp(10px,1.4vw,16px)}
.sub button:hover{color:var(--hot)}
.prof{padding:10px 24px 10px 5vw;background:var(--pan2);font-size:clamp(11px,1.6vw,20px);margin-bottom:6px}
footer{position:absolute;left:5vw;right:3vw;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;font-size:clamp(8px,1.1vw,13px);color:var(--ink);text-shadow:1px 1px 0 #000;gap:12px}
#veil{position:absolute;inset:0;background:#05040bcc;display:none;align-items:center;justify-content:center;padding:16px}
#veil.on{display:flex}
#panel{width:min(560px,100%);max-height:90%;overflow:auto;background:var(--pan);border:3px solid var(--acc);box-shadow:6px 6px 0 #000,inset 0 0 0 2px #000;padding:20px}
#panel h2{margin:0 0 14px;font-size:clamp(16px,2.4vw,26px);color:var(--hot)}
#panel p,#panel li{font-size:clamp(11px,1.5vw,15px);line-height:1.7;color:var(--ink);margin:0 0 8px}
#panel ul{padding-left:18px;margin:0 0 10px}
.lbl{display:block;font-size:11px;color:var(--dim);margin:12px 0 6px;letter-spacing:2px}
input{font:inherit;width:100%;padding:10px;background:#05040b;color:var(--hot);border:2px solid var(--acc);text-transform:uppercase}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:120px;padding:10px;background:#0d0c1a;border:2px solid #2d2850;font-size:12px;text-align:left;line-height:1.5}
.opt b{display:block;color:var(--hot);font-size:14px}
.opt.on{border-color:var(--hot);background:#1d1a35}
.btn{margin-top:16px;margin-right:8px;padding:10px 18px;background:var(--acc);font-size:13px;font-weight:700;box-shadow:3px 3px 0 #000}
.btn:hover{background:#8466c9}
.btn.ghost{background:#0d0c1a;border:2px solid #2d2850}
.lock{color:var(--dim)}
pre{font:inherit;font-size:clamp(11px,1.5vw,15px);line-height:1.8;white-space:pre-wrap;margin:0;min-height:130px}
.hud{display:flex;gap:8px;margin-top:10px}.hud span{flex:1;background:#0d0c1a;border:2px solid #2d2850;padding:6px;font-size:11px;text-align:center}
@media (max-width:600px){.sub{display:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Pixel art galaxy with a rover on a ridge looking out at it"></canvas>
  <div id="shade"></div><div id="scan"></div>
  <h1 class="title">MOONBREAKERS<small>A NASA SPACE APPS 2026 MISSION</small></h1>
  <nav id="menu" class="hide" aria-label="Main menu"></nav>
  <button id="start" class="start">START</button>
  <div class="sub">
    <div class="prof" id="prof"></div>
  </div>
  <footer><span>(c) 2026 Your Team Name</span><span>Prototype v0.1.0</span></footer>
  <div id="veil"><div id="panel" role="dialog" aria-modal="true"></div></div>
</div>
<script>
/* ---------- state ---------- */
const S={sound:true,scan:true,mission:null,launched:0,callsign:'PIONEER'};
try{const m=JSON.parse(localStorage.getItem('st_mission')||'null');if(m)S.mission=m;S.launched=+localStorage.getItem('st_launched')||0;S.callsign=localStorage.getItem('st_callsign')||S.callsign}catch(e){}
const save=()=>{try{localStorage.setItem('st_mission',JSON.stringify(S.mission));localStorage.setItem('st_launched',S.launched);localStorage.setItem('st_callsign',S.callsign)}catch(e){}};

/* ---------- pixel scene ---------- */
const W=320,H=180,cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const hs=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return hs(xi,yi)*(1-u)*(1-v)+hs(xi+1,yi)*u*(1-v)+hs(xi,yi+1)*(1-u)*v+hs(xi+1,yi+1)*u*v};
const fbm=(x,y)=>{let a=.5,s=0,f=1;for(let i=0;i<4;i++){s+=a*vn(x*f,y*f);f*=2;a*=.5}return s};
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const R={
 blue:['#04041a','#0a1040','#18287a','#2d52b4','#5a88dc'],
 purple:['#08041a','#240e48','#44187a','#7a2cb0','#a85ad8'],
 red:['#10030a','#360c16','#741c1c','#c04822','#f08030'],
 green:['#020c06','#07240f','#0f4a1c','#1f7a2c','#4cb04a']}
 ;for(const k in R)R[k]=R[k].map(rgb);
const bay=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const bg=document.createElement('canvas');bg.width=W;bg.height=H;const b=bg.getContext('2d');
const img=b.createImageData(W,H);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
 const n=fbm(x/36,y/36),c=fbm(x/80+9,y/80+3),gx=x/W;
 let lv=(n-.18)*1.5+(bay[(y%4)*4+x%4]/16-.5)*.2;
 const ramp=(c+(gx-.5)*.2)<.5?R.blue:R.purple;
 const col=ramp[Math.max(0,Math.min(4,Math.floor(lv*5)))],i=(y*W+x)*4;
 img.data[i]=col[0];img.data[i+1]=col[1];img.data[i+2]=col[2];img.data[i+3]=255}
b.putImageData(img,0,0);
const px=(c,x,y,col,w=1,h=1)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h)};
function disc(c,cx,cy,r,t,lx=-.6,ly=-.6){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const d=Math.hypot(x,y);if(d>r)continue;
 const k=(x/r)*lx+(y/r)*ly+(bay[((cy+y)&3)*4+((cx+x)&3)]/16-.5)*.25;
 px(c,cx+x,cy+y,d>r-1.1?t[3]:k>.3?t[2]:k>-.25?t[1]:t[0])}}
function ring(c,cx,cy,r,col,front){for(let a=0;a<6.28;a+=.02){const s=Math.sin(a);if((s>0)!==front)continue;px(c,cx+Math.cos(a)*r*1.9,cy+s*r*.5,col)}}
function rock(c,cx,cy,r){const t=['#1c1440','#4a3a8c','#9a8ae0'];for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){if(Math.hypot(x*.9,y)>r-hs(x+cx,y+cy)*1.3)continue;px(c,cx+x,cy+y,x+y<-r*.4?t[2]:x+y<r*.5?t[1]:t[0])}}
const PL=[[235,44,13,['#1a0e3a','#4a2a8c','#8a5ad0','#c8a0f8'],.00006,1,'#a880ff'],[118,38,9,['#0a1a4a','#1c3a9a','#4c7ae0','#a0c8ff'],.00007,2,null],[152,100,21,['#140a30','#3a1a6e','#7a3cc0','#d890ff'],.00004,3,null],[60,60,7,['#1c0c48','#4a2a9a','#8a60e0','#c8b0ff'],.00005,4,null]];
function drawPlanet(p,t){const[cx,cy,r,tn,sp,sd,rg]=p,rot=t*sp;if(rg)ring(ctx,cx,cy,r,rg,false);
 for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const d=Math.hypot(x,y);if(d>r)continue;const nx=x/r,ny=y/r,nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
  const n=fbm(Math.atan2(nx,nz)*2.4+rot*2.4+sd*7,ny*3+sd*3),k=nx*-.6+ny*-.6+nz*.15;let i=k>.3?2:k>-.25?1:0;
  if(n>.58)i=Math.min(3,i+1);else if(n<.36)i=Math.max(0,i-1);
  px(ctx,cx+x,cy+y,d>r-1.1?tn[3]:tn[i])}
 if(rg)ring(ctx,cx,cy,r,rg,true)}
[[40,120,4],[190,138,3],[285,92,3],[96,20,3],[300,30,2],[180,26,2],[20,22,3]].forEach(a=>rock(b,...a));
// spiral galaxy
for(let i=0;i<900;i++){const t=Math.pow(Math.random(),.8),arm=i%2,ang=t*5.4+arm*Math.PI,r=t*42+hs(i,1)*4;
 const x=186+Math.cos(ang)*r+(hs(i,2)-.5)*6*t,y=64+Math.sin(ang)*r*.42+(hs(i,4)-.5)*3*t;
 px(b,x,y,t<.15?'#f4eaff':t<.4?'#d0b0ff':t<.7?'#8fb4ff':'#4a5fd0',t<.2&&i%3==0?2:1,1)}
// foreground ridge + rover
const fg=document.createElement('canvas');fg.width=W;fg.height=H;const f=fg.getContext('2d');
const DK='#0b0914',RIM='#cdb48a',ground=x=>158-(x-150)*.1+vn(x/9,3)*7+Math.max(0,x-292)*.5;
for(let x=130;x<W;x++){const g=Math.round(ground(x));px(f,x,g,DK,1,H-g);px(f,x,g,RIM);if(hs(x,7)>.7)px(f,x,g+1,RIM);if(hs(x,8)>.93)px(f,x,g+3,RIM)}
for(let x=0;x<W;x++){const g=Math.round(172+vn(x/6,1)*8);if(x<130||x>120){px(f,x,g,DK,1,H-g)}}
const ox=232,oy=Math.round(ground(ox+17));
for(let i=0;i<3;i++){const wx=ox+5+i*12;for(let y=-5;y<=5;y++)for(let x=-5;x<=5;x++){const d=Math.hypot(x,y);if(d<=5)px(f,wx+x,oy-5+y,d>3.8?RIM:DK)}px(f,wx,oy-5,RIM)}
px(f,ox,oy-17,DK,38,9);px(f,ox,oy-17,RIM,38,1);px(f,ox,oy-17,RIM,1,9);
px(f,ox+3,oy-22,DK,24,4);px(f,ox+3,oy-22,RIM,24,1);px(f,ox+9,oy-22,RIM,1,4);px(f,ox+17,oy-22,RIM,1,4);
px(f,ox+6,oy-36,DK,3,14);px(f,ox+6,oy-36,RIM,1,14);
px(f,ox-1,oy-42,DK,11,7);px(f,ox-1,oy-42,RIM,11,1);px(f,ox-1,oy-42,RIM,1,7);
px(f,ox+30,oy-34,DK,2,12);px(f,ox+26,oy-38,DK,10,4);px(f,ox+26,oy-38,RIM,10,1);
px(f,ox-9,oy-15,DK,10,2);px(f,ox-9,oy-15,RIM,2,1);px(f,ox-10,oy-13,DK,3,5);
const lens={x:ox,y:oy-39};
// shooting stars + twinkles
const stars=[...Array(110)].map(()=>({x:Math.random()*W|0,y:Math.random()*H*.85|0,p:Math.random()*6.28,big:Math.random()<.12}));
let shoot=null,t0=0;
function frame(t){requestAnimationFrame(frame);if(t-t0<80)return;t0=t;
 ctx.drawImage(bg,0,0);for(const p of PL)drawPlanet(p,t);
 for(const s of stars){const a=.35+.65*Math.abs(Math.sin(t/900+s.p));ctx.globalAlpha=a;px(ctx,s.x,s.y,'#bfefff');if(s.big){px(ctx,s.x-1,s.y,'#7fd0ff');px(ctx,s.x+1,s.y,'#7fd0ff');px(ctx,s.x,s.y-1,'#7fd0ff');px(ctx,s.x,s.y+1,'#7fd0ff')}}
 ctx.globalAlpha=1;
 if(!shoot&&Math.random()<.01)shoot={x:W*.5+Math.random()*120,y:Math.random()*40,l:0};
 if(shoot){for(let i=0;i<8;i++)px(ctx,shoot.x-i,shoot.y+i*.4,i<2?'#fff':'#7fd0ff');shoot.x-=4;shoot.y+=1.6;if(++shoot.l>40)shoot=null}
 ctx.drawImage(fg,0,0);
 px(ctx,lens.x,lens.y,'#7fffe0');px(ctx,lens.x,lens.y+1,'#7fffe0');
 if(Math.floor(t/600)%2)px(ctx,ox+31,oy-39,'#ff4a4a');
}
requestAnimationFrame(frame);

/* ---------- sound ---------- */
let ac;const beep=(f=520,d=.06)=>{if(!S.sound)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};

/* ---------- UI ---------- */
const $=s=>document.querySelector(s),menu=$('#menu'),veil=$('#veil'),panel=$('#panel');
let sel=0,items=[];
function buildMenu(){
 items=[['Continue','cont',!hasM()],['New Mission','new']];
 menu.innerHTML=items.map((it,i)=>`<button data-go="${it[1]}" data-i="${i}" ${it[2]?'disabled':''}>${it[0]}</button>`).join('');
 $('#prof').textContent='Profile: '+S.callsign;paint()}
function paint(){[...menu.children].forEach((b,i)=>b.classList.toggle('sel',i===sel))}
function open(html){panel.innerHTML=html;veil.classList.add('on');const f=panel.querySelector('input,button');f&&f.focus();beep(660)}
function close(){veil.classList.remove('on');beep(330)}
const back='<button class="btn ghost" data-go="close">Back</button>';
const DEST={Moon:['3 days','Training run. Gentle.'],Mars:['180 days','The classic long haul.'],Europa:['600 days','Ice, radiation, no mercy.']};
let dest='Mars';
const screens={
 new(){open(`<h2>New Mission</h2><span class="lbl">CALLSIGN</span><input id="cs" maxlength="12" value="${S.callsign}">
 <span class="lbl">DESTINATION</span><div class="row">${Object.entries(DEST).map(([k,v])=>`<button class="opt ${k===dest?'on':''}" data-dest="${k}"><b>${k}</b>${v[0]}<br>${v[1]}</button>`).join('')}</div>
 <button class="btn" data-go="launch">Launch</button>${back}`)},
 launch(){S.callsign=($('#cs')?.value||'PIONEER').toUpperCase().slice(0,12)||'PIONEER';S.mission={cs:S.callsign,dest,day:1};S.launched++;save();buildMenu();screens.brief()},
 cont(){if(S.mission)screens.brief()},
 brief(){const m=S.mission,txt=`MISSION CONTROL > ${m.cs}\nTARGET ......... ${m.dest.toUpperCase()}\nDISTANCE ....... ${DEST[m.dest][0].toUpperCase()}\nDAY ${m.day}. THE ROVER AWAITS YOUR ORDERS.`;
  open(`<h2>Mission Briefing</h2><pre id="tw"></pre><div class="hud"><span>O2 100%</span><span>POWER 100%</span><span>FOOD 100%</span></div><button class="btn" data-go="travel">Begin Journey</button>${back}`);
  let i=0;const el=$('#tw');(function t(){if(!el.isConnected||i>txt.length)return;el.textContent=txt.slice(0,i++);if(i%3==0)beep(900,.02);setTimeout(t,25)})()},
 travel(){open(`<h2>Travel Dashboard</h2><p>Placeholder: this is where the trail loop lives. Pace, rations, random events and rover repairs plug in here.</p>${back}`)},
 opt(){open(`<h2>Options</h2><div class="row"><button class="opt ${S.sound?'on':''}" data-tg="sound"><b>Sound</b>${S.sound?'On':'Off'}</button><button class="opt ${S.scan?'on':''}" data-tg="scan"><b>Scanlines</b>${S.scan?'On':'Off'}</button></div>${back}`)},
 cred(){open(`<h2>Credits</h2><ul><li>Design and development: Your Team Name</li><li>Built for the NASA Space Apps Challenge 2026</li><li>Inspired by The Oregon Trail</li><li>Pixel art: made in code</li></ul>${back}`)},
 ach(){open(`<h2>Achievements</h2><ul><li class="lock">[ ] First Light: launch a mission</li><li class="lock">[ ] Red Planet: reach Mars</li><li class="lock">[ ] Frugal: finish with 50% supplies</li><li class="lock">[ ] Ice Breaker: reach Europa</li></ul>${S.launched?'<p>First Light unlocked!</p>':''}${back}`)},
 stats(){open(`<h2>Statistics</h2><ul><li>Missions launched: ${S.launched}</li><li>Missions completed: 0</li><li>Crew lost: 0</li></ul>${back}`)},
 quit(){open(`<h2>Return to Earth?</h2><p>Close this tab to quit, or stay and keep exploring.</p><button class="btn" data-go="close">Stay</button>`)},
 close
};
/* ---- Moonbreakers flow: start > menu > level > story > crew > trail > duration > go ---- */
const hasM=()=>S.mission&&S.mission.players;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROLES=['Mission Commander','Rover Pilot','Flight Engineer','Geologist','Flight Surgeon','CAPCOM (Comms)'];
const LV={Easy:'Calm lunar day. Generous supplies.',Medium:'Dust storms and tighter margins.',Hard:'Long nights. Every choice counts.'};
const TR={'Shackleton Rim':['South Pole, 9 days','Icy shadows, steep craters, water ice to harvest.'],'Tranquility Basin':['Sea of Tranquility, 14 days','Flat dust plains, long drive, plenty of sunlight.']};
let G={level:'Easy',story:'Year 2041. A lunar outpost has gone quiet and its crew is waiting for rescue. Your rover team must cross the Moon, repair what is broken and bring everyone home before the lunar night falls.',mode:'solo',count:2,players:[],trail:'',dur:15},cur='';
const startEl=$('#start');startEl.onclick=()=>{startEl.classList.add('hide');menu.classList.remove('hide');beep(520)};
const grab=()=>{const s=$('#story');if(s)G.story=s.value;document.querySelectorAll('.pn').forEach((el,i)=>{if(G.players[i])G.players[i].n=el.value})};
const sync=()=>{const n=G.mode==='solo'?1:G.count;while(G.players.length<n)G.players.push({n:'',role:ROLES.find(r=>!G.players.some(p=>p.role===r))});G.players.length=n};
const optb=(k,v,t,d,on)=>`<button class="opt ${on?'on':''}" data-pick="${k}:${v}"><b>${t}</b>${d}</button>`;
const step=(name,n,title,body,prev,next)=>{cur=name;open(`<span class="lbl">STEP ${n} OF 5</span><h2>${title}</h2>${body}${next}<button class="btn ghost" data-go="${prev}">Back</button>`)};
screens.new=()=>step('new',1,'Mission Level',`<div class="row">${Object.entries(LV).map(([k,d])=>optb('level',k,k,d,G.level===k)).join('')}</div>`,'close','<button class="btn" data-go="story">Next</button>');
screens.story=()=>{grab();step('story',2,'Mission Story',`<span class="lbl">WRITE YOUR BACKGROUND STORY</span><textarea id="story" maxlength="500">${esc(G.story)}</textarea>`,'new','<button class="btn" data-go="players">Next</button>')};
screens.players=()=>{grab();sync();step('players',3,'Crew',`<div class="row">${optb('mode','solo','Single Player','One crew member',G.mode==='solo')}${optb('mode','multi','Multiplayer','2 to 4 crew, one role each',G.mode==='multi')}</div>`+(G.mode==='multi'?`<span class="lbl">CREW SIZE</span><div class="row">${[2,3,4].map(c=>optb('count',c,c+' Players','',G.count===c)).join('')}</div>`:'')+`<span class="lbl">${G.mode==='solo'?'YOUR NAME AND ROLE':'NAMES AND ROLES'}</span>`+G.players.map((p,i)=>`<div class="row" style="margin-bottom:8px"><input class="pn" style="flex:1;min-width:120px" maxlength="12" placeholder="PLAYER ${i+1}" value="${esc(p.n)}"><select class="pr" data-i="${i}">${ROLES.map(r=>`<option ${r===p.role?'selected':''}>${r}</option>`).join('')}</select></div>`).join(''),'story','<button class="btn" data-go="trail">Next</button>')};
screens.trail=()=>{grab();step('trail',4,'Choose Your Trail',`<div class="row">${Object.entries(TR).map(([k,v])=>optb('trail',k,k,v[0]+'<br>'+v[1],G.trail===k)).join('')}</div>`,'players',`<button class="btn" data-go="dur" ${G.trail?'':'disabled'}>Next</button>`)};
screens.dur=()=>step('dur',5,'Mission Duration',`<div class="row">${[5,15,20].map(m=>optb('dur',m,m+' min',m===5?'Quick run':m===15?'Standard':'Full mission',G.dur===m)).join('')}</div>`,'trail','<button class="btn" data-go="start">Start Game</button>');
function showGame(){const m=S.mission;cur='game';open(`<h2>Mission Start</h2><pre>${esc(`LEVEL ...... ${m.level.toUpperCase()}\nTRAIL ...... ${m.trail.toUpperCase()}\nDURATION ... ${m.dur} MIN\nCREW:\n`+m.players.map((p,i)=>` ${(p.n||'PLAYER '+(i+1)).toUpperCase()} - ${p.role}`).join('\n'))}</pre><p>${esc(m.story)}</p><p class="lock">Gameplay loop plugs in here (showGame).</p><button class="btn ghost" data-go="close">Main menu</button>`)}
screens.start=()=>{S.mission=JSON.parse(JSON.stringify(G));S.callsign=((G.players[0]&&G.players[0].n)||'PIONEER').toUpperCase();S.launched++;save();buildMenu();showGame()};
screens.cont=()=>{if(hasM())showGame()};
document.addEventListener('click',e=>{const t=e.target.closest('[data-pick]');if(!t)return;grab();const s=t.dataset.pick,i=s.indexOf(':'),k=s.slice(0,i),v=s.slice(i+1);G[k]=/^\d+$/.test(v)?+v:v;screens[cur]()});
document.addEventListener('change',e=>{const s=e.target.closest('.pr');if(!s)return;grab();const i=+s.dataset.i,old=G.players[i].role,o=G.players.find((p,j)=>j!==i&&p.role===s.value);if(o)o.role=old;G.players[i].role=s.value;screens.players()});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.dest){dest=t.dataset.dest;S.callsign=$('#cs').value.toUpperCase()||S.callsign;screens.new();return}
 if(t.dataset.tg){S[t.dataset.tg]=!S[t.dataset.tg];$('#scan').style.display=S.scan?'':'none';screens.opt();return}
 if(t.dataset.go&&screens[t.dataset.go])screens[t.dataset.go]()});
menu.addEventListener('mouseover',e=>{const b=e.target.closest('button');if(b&&!b.disabled){sel=+b.dataset.i;paint();beep(440,.03)}});
document.addEventListener('keydown',e=>{
 if(veil.classList.contains('on')){if(e.key==='Escape')close();return}
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const d=e.key==='ArrowDown'?1:-1;do{sel=(sel+d+items.length)%items.length}while(items[sel][2]);paint();beep(440,.03)}
 if(e.key==='Enter'){if(!startEl.classList.contains('hide')){startEl.click();return}const b=menu.children[sel];b&&!b.disabled&&b.click()}});
buildMenu();sel=hasM()?0:1;paint();
</script>
</body>
</html>
